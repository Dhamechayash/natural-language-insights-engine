<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
  <style>.b{fill:#f6f8fa;stroke:#57606a;rx:6}.w{fill:#fff8e1;stroke:#d4a72c}.g{fill:#e6f4ea;stroke:#2da44e}.l{stroke:#444;fill:none;marker-end:url(#a)}.t{fill:#1b1f24}.s{fill:#57606a;font-size:11px}</style>
  <rect class="b" x="20" y="20" width="140" height="50"/><text class="t" x="90" y="50" text-anchor="middle">Browser UI / curl</text>
  <rect class="b" x="220" y="20" width="200" height="50"/><text class="t" x="320" y="42" text-anchor="middle">API (FastAPI)</text><text class="s" x="320" y="58" text-anchor="middle">validate · enqueue · report</text>
  <rect class="b" x="480" y="20" width="200" height="50"/><text class="t" x="580" y="42" text-anchor="middle">Job store (SQLite)</text><text class="s" x="580" y="58" text-anchor="middle">datasets · jobs · leases</text>
  <rect class="b" x="480" y="120" width="200" height="50"/><text class="t" x="580" y="142" text-anchor="middle">Worker pool (threads)</text><text class="s" x="580" y="158" text-anchor="middle">atomic claim · retry · reaper</text>
  <rect class="b" x="220" y="240" width="200" height="60"/><text class="t" x="320" y="262" text-anchor="middle">Ingest + Profiler</text><text class="s" x="320" y="278" text-anchor="middle">CSV → DuckDB, schema profile</text><text class="s" x="320" y="292" text-anchor="middle">(+ optional LLM annotation)</text>
  <rect class="b" x="480" y="240" width="200" height="60"/><text class="t" x="580" y="262" text-anchor="middle">Query engine</text><text class="s" x="580" y="278" text-anchor="middle">prompt → SQL → validate →</text><text class="s" x="580" y="292" text-anchor="middle">run read-only → grounded answer</text>
  <rect class="w" x="720" y="240" width="160" height="60"/><text class="t" x="800" y="266" text-anchor="middle">LLM (Claude)</text><text class="s" x="800" y="284" text-anchor="middle">behind an interface</text>
  <rect class="g" x="220" y="370" width="200" height="60"/><text class="t" x="320" y="394" text-anchor="middle">DuckDB file per dataset</text><text class="s" x="320" y="412" text-anchor="middle">atomic swap on load</text>
  <rect class="b" x="480" y="370" width="200" height="60"/><text class="t" x="580" y="394" text-anchor="middle">SQL validator (sqlglot)</text><text class="s" x="580" y="412" text-anchor="middle">+ read-only, no file access</text>
  <path class="l" d="M160 45 H220"/><path class="l" d="M420 45 H480"/><path class="l" d="M580 70 V120"/>
  <path class="l" d="M530 170 L380 240"/><path class="l" d="M580 170 V240"/><path class="l" d="M680 270 H720"/>
  <path class="l" d="M320 300 V370"/><path class="l" d="M580 300 V370"/><path class="l" d="M480 400 H420"/>
</svg>
