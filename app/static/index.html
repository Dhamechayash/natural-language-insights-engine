<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insights Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 15px/1.45 system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1b1f24; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 260px; padding: .5rem; }
  button { padding: .5rem .9rem; cursor: pointer; }
  select { padding: .45rem; }
  .card { border: 1px solid #d0d7de; border-radius: 6px; padding: .8rem 1rem; margin-top: .8rem; }
  .answer { font-size: 1.05rem; }
  .refused { border-color: #d4a72c; background: #fff8e1; }
  .failed { border-color: #cf222e; background: #ffebe9; }
  .cache { background: #eef6ff; border: 1px solid #b6d4fe; border-radius: 4px; padding: .45rem .6rem;
           margin-bottom: .6rem; font-size: .85rem; }
  .badge { background: #0969da; color: #fff; border-radius: 10px; padding: .05rem .5rem; font-weight: 600; margin-right: .3rem; }
  .muted { color: #57606a; font-size: .85rem; }
  pre { background: #f6f8fa; padding: .6rem; overflow-x: auto; border-radius: 4px; }
  .sql { position: relative; }
  .sql pre { padding-right: 2.6rem; }
  .copy { position: absolute; top: .35rem; right: .35rem; padding: .3rem; line-height: 0; background: #fff;
          border: 1px solid #d0d7de; border-radius: 4px; color: #57606a; }
  .copy:hover { color: #1b1f24; background: #f3f4f6; }
  .copy.done { color: #1a7f37; border-color: #1a7f37; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { border: 1px solid #d0d7de; padding: .25rem .5rem; text-align: left; }
  th { background: #f6f8fa; }
  .scroll { max-height: 320px; overflow: auto; margin-top: .5rem; }
  .q { font-weight: 600; margin-top: 1.2rem; }
  #out:not(:empty) + #ask-row { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Natural Language Insights Engine</h1>

<h2>1. Dataset</h2>
<div class="row">
  <input type="file" id="file" accept=".csv,.tsv,.txt">
  <button id="upload">Upload &amp; load</button>
  <select id="datasets"></select>
</div>
<div id="dataset-status" class="muted"></div>
<details id="schema-box" class="muted"><summary>Inferred schema</summary><div id="schema"></div></details>

<h2>2. Ask a question</h2>
<div id="out"></div>
<!-- Sits below the thread so follow-ups are typed under the latest answer. -->
<div class="row" id="ask-row">
  <input type="text" id="question" placeholder="e.g. Top 10 products by revenue" disabled>
  <button id="ask" disabled>Ask</button>
  <button id="new-thread" hidden>New question</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error ? `${body.error.message} (${body.error.code})` : "Request failed");
  return body;
}

async function pollJob(id, onTick) {
  for (;;) {
    const job = await api(`/jobs/${id}`);
    onTick(job);
    if (["succeeded", "failed", "refused"].includes(job.status)) return job;
    await sleep(500);
  }
}

async function refreshDatasets(select) {
  const { datasets } = await api("/datasets");
  $("datasets").innerHTML = datasets.map((d) => `<option value="${d.id}">${esc(d.name)} (${d.status})</option>`).join("");
  if (select) $("datasets").value = select;
  await showDataset();
}

async function showDataset() {
  const id = $("datasets").value;
  const ready = id && (await api(`/datasets/${id}`));
  const ok = ready && ready.status === "ready";
  $("question").disabled = $("ask").disabled = !ok;
  $("dataset-status").textContent = ready ? `${ready.status}${ready.rows ? ` · ${ready.rows.toLocaleString()} rows · ${ready.columns.length} columns` : ""}` : "No dataset yet.";
  $("schema").innerHTML = ok ? `<table><tr><th>Column</th><th>Type</th><th>Nulls %</th><th>Distinct</th></tr>${ready.profile.columns
    .map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${c.null_pct}</td><td>${c.distinct}</td></tr>`).join("")}</table>` : "";
}

// Id of the last answered question; the next question is sent as its follow-up.
let lastJobId = null;

function resetThread() {
  lastJobId = null;
  $("out").innerHTML = "";
  $("new-thread").hidden = true;
  $("question").placeholder = "e.g. Top 10 products by revenue";
}

$("datasets").onchange = () => { resetThread(); showDataset(); };
$("new-thread").onclick = () => { resetThread(); $("question").focus(); };

$("upload").onclick = async () => {
  const f = $("file").files[0];
  if (!f) return;
  const form = new FormData();
  form.append("file", f);
  try {
    resetThread();
    $("dataset-status").textContent = "Uploading…";
    const { dataset_id, job_id } = await api("/datasets", { method: "POST", body: form });
    await refreshDatasets(dataset_id);
    const job = await pollJob(job_id, (j) => ($("dataset-status").textContent = `Loading… ${j.status}`));
    await refreshDatasets(dataset_id);
    if (job.status === "failed") $("dataset-status").textContent = `Load failed: ${job.error.message}`;
  } catch (e) {
    $("dataset-status").textContent = e.message;
  }
};

function cacheInfo(r) {
  if (!r.cache) return "";
  const s = r.cache.saved;
  const cost = s.cost_usd == null ? "n/a" : `$${s.cost_usd.toFixed(4)}`;
  return `<div class="cache"><span class="badge">Cache</span>
    Answered from cache (originally ${esc(new Date(r.cache.answered_at * 1000).toLocaleString())}) ·
    tokens saved <b>${s.total_tokens.toLocaleString()}</b>
    <span class="muted">(${s.input_tokens.toLocaleString()} in / ${s.output_tokens.toLocaleString()} out)</span> ·
    cost saved <b>${cost}</b> <span class="muted">on ${esc(s.model)}</span></div>`;
}

function render(job) {
  const r = job.result || {};
  if (job.status === "failed") return `<div class="card failed">Failed: ${esc(job.error.message)} <span class="muted">(${esc(job.error.code)})</span></div>`;
  if (job.status === "refused") return `<div class="card refused">${cacheInfo(r)}<b>Can't answer this from the data.</b><br>${esc(r.reason)}${r.detail ? `<div class="muted">${esc(r.detail)}</div>` : ""}</div>`;
  const head = r.columns.map((c) => `<th>${esc(c)}</th>`).join("");
  const body = r.rows.map((row) => `<tr>${row.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
  const assumptions = (r.assumptions || []).map((a) => `<li>${esc(a)}</li>`).join("");
  const resolved = job.follow_up_of && r.resolved_question && r.resolved_question !== job.question
    ? `<div class="muted">Interpreted as: ${esc(r.resolved_question)}</div>` : "";
  return `<div class="card">${cacheInfo(r)}${resolved}<div class="answer">${esc(r.answer)}</div>
    ${r.answer_verified ? "" : `<div class="muted">Narration could not be verified against the data; showing a plain summary. Check the table.</div>`}
    ${assumptions ? `<div class="muted">Assumptions:<ul>${assumptions}</ul></div>` : ""}
    <details open><summary class="muted">SQL</summary><div class="sql"><pre>${esc(r.sql)}</pre>
      <button class="copy" type="button" title="Copy SQL" aria-label="Copy SQL">${COPY_ICON}</button></div></details>
    <div class="scroll"><table><tr>${head}</tr>${body}</table></div>
    <div class="muted">${r.rows.length} row(s)${r.truncated ? " (truncated)" : ""} · tokens in/out ${r.usage.input_tokens}/${r.usage.output_tokens}</div></div>`;
}

async function ask() {
  const question = $("question").value.trim();
  if (question.length < 3) return;
  $("ask").disabled = true;
  const turn = document.createElement("div");
  turn.innerHTML = `<div class="q">${esc(question)}</div><div class="card muted">Submitting…</div>`;
  $("out").append(turn);
  const slot = turn.lastElementChild;
  try {
    const { job_id } = await api(`/datasets/${$("datasets").value}/questions`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, follow_up_of: lastJobId }),
    });
    const job = await pollJob(job_id, (j) => (slot.textContent = `Job ${j.status}…`));
    slot.outerHTML = render(job);
    // Failed jobs are not part of the thread; follow-ups attach to the last finished turn.
    if (job.status !== "failed") lastJobId = job.id;
    $("question").value = "";
    $("question").placeholder = "Ask a follow-up, e.g. \"and by month?\"";
    $("new-thread").hidden = false;
    turn.scrollIntoView({ behavior: "smooth", block: "start" });
    $("question").focus();
  } catch (e) {
    slot.outerHTML = `<div class="card failed">${esc(e.message)}</div>`;
  } finally {
    $("ask").disabled = false;
  }
}
const COPY_ICON = `<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>`;
const CHECK_ICON = `<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>`;

// Answer cards are rendered as HTML strings, so copy clicks are handled by delegation.
$("out").onclick = async (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  try {
    await navigator.clipboard.writeText(btn.parentElement.querySelector("pre").textContent);
    btn.innerHTML = CHECK_ICON;
    btn.classList.add("done");
    btn.title = "Copied";
  } catch {
    btn.title = "Copy failed";
  }
  setTimeout(() => { btn.innerHTML = COPY_ICON; btn.classList.remove("done"); btn.title = "Copy SQL"; }, 1500);
};

$("ask").onclick = ask;
$("question").onkeydown = (e) => { if (e.key === "Enter") ask(); };
refreshDatasets();
</script>
</body>
</html>
